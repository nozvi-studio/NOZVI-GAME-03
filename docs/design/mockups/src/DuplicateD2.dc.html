<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duplicate skin D2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&amp;display=swap">
<style>
body{margin:0}
a{cursor:pointer}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#F8F2E8;font-family:'Nunito',system-ui,sans-serif;color:#5A3B3B;overflow:hidden">

  <div style="position:absolute;left:16px;right:16px;top:22px;display:flex;align-items:center;justify-content:space-between">
    <a href="MarbleMachineD2.dc.html" aria-label="Back" style="width:44px;height:44px;border-radius:50%;background:#FFFCF6;box-shadow:0 4px 10px -3px rgba(110,80,70,.16);display:flex;align-items:center;justify-content:center;text-decoration:none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-weight:900;font-size:24px">Skin drop</span>
    <div style="width:44px"></div>
  </div>

  <div style="position:absolute;left:0;right:0;top:80px;text-align:center;font-weight:800;font-size:15px;color:#8A6A6A">Mystery skin! Which rarity will it be?</div>

  <div style="position:absolute;left:16px;top:116px;width:358px;height:600px;box-sizing:border-box;border-radius:28px;background:#FFFCF6;box-shadow:0 14px 24px -14px rgba(110,80,70,.3);overflow:hidden">

    <svg width="358" height="70" viewBox="0 0 358 70" aria-hidden="true" style="position:absolute;left:0;top:0"><path d="M120 0H238L214 42H144z" fill="#EFE6D8"></path><path d="M144 42H214L206 56H152z" fill="#E3DCD2"></path></svg>

    <sc-for list="{{pegs}}" as="p" hint-placeholder-count="30"><div style="{{p.style}}"></div></sc-for>

    <div style="position:absolute;left:172px;top:140px;width:10px;height:10px;border-radius:50%;background:#F4A157;opacity:.2"></div>
    <div style="position:absolute;left:170px;top:116px;width:14px;height:14px;border-radius:50%;background:#F4A157;opacity:.3"></div>
    <div style="position:absolute;left:168px;top:88px;width:18px;height:18px;border-radius:50%;background:#F4A157;opacity:.4"></div>
    <div style="position:absolute;left:150px;top:177px;line-height:0;filter:drop-shadow(0 5px 6px rgba(110,80,70,.3))"><div style="width:56px;height:56px;box-sizing:border-box;border-radius:50%;background:radial-gradient(circle at 35% 30%, #FBE19A, #F8D468 60%, #E5A82A);border:4px solid #FFFCF6;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:#5A3B3B;line-height:1">?</div></div>

    <div style="position:absolute;left:0;right:0;bottom:0;height:218px;box-sizing:border-box;padding:0 6px;display:flex;gap:4px;align-items:flex-end">
      <sc-for list="{{baskets}}" as="s" hint-placeholder-count="3">
        <div style="{{s.cardStyle}}">
          <div style="{{s.tileStyle}}">
            <span style="font-weight:900;font-size:28px;color:#5A3B3B">?</span>
          </div>
                    <span style="{{s.rarStyle}}">{{s.rar}}</span>
          <span style="font-weight:900;font-size:14px;line-height:1">{{s.pct}}</span>
                  </div>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;top:732px;text-align:center;font-weight:700;font-size:13px;color:#8A6A6A;padding:0 32px">The result is decided when your marble lands in SKIN; the drop only shows it. A skin you already own turns into coins (15 / 40 / 100).</div>

  <sc-if value="{{landed}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;top:0;width:390px;height:844px;background:rgba(90,59,59,.4);display:flex;align-items:center;justify-content:center">
      <div role="dialog" aria-label="Already yours" style="position:relative;width:310px;box-sizing:border-box;padding:68px 20px 22px;border-radius:30px;background:#FFFCF6;box-shadow:0 20px 36px -14px rgba(90,59,59,.5);display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="position:absolute;left:50%;top:-52px;transform:translateX(-50%);width:112px;height:112px;border-radius:32px;background:#D9DDF5;box-shadow:0 10px 18px -10px rgba(110,80,70,.4);display:flex;align-items:center;justify-content:center"><dc-import name="PlayerHead" skin="tux" size="88" glow="false" stroke="none" sw="0" hint-size="88px,88px"></dc-import></div>
        <span style="height:24px;padding:0 12px;border-radius:999px;background:#EFE6D8;color:#5A3B3B;font-weight:900;font-size:12px;letter-spacing:.08em;display:flex;align-items:center">DUPLICATE</span>
        <span style="font-weight:900;font-size:30px;line-height:1.1">Already yours!</span>
        <span style="font-weight:800;font-size:14px;color:#8A6A6A">Tuxedo · Rare</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8A6A6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top:4px"><path d="M7 9l5 5 5-5"/></svg>
        <div role="status" style="display:flex;align-items:center;justify-content:center;gap:10px;align-self:stretch;height:64px;border-radius:22px;background:#FBE19A"><svg width="38" height="38" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F8D468" stroke="#E5A82A" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#E5A82A" stroke-width="2"/></svg><span style="font-weight:900;font-size:32px">+40 coins</span></div>
        <a href="MarbleMachineD2.dc.html" style="margin-top:12px;align-self:stretch;display:flex;align-items:center;justify-content:center;height:58px;border-radius:999px;background:#79D391;box-shadow:inset 0 -6px 0 #5DB878, 0 8px 14px -8px rgba(74,154,99,.6);text-decoration:none;color:#2F5B3F;font-weight:900;font-size:22px">Collect</a>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["falling","landed"],"default":"landed"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'landed';
    const landed = state === 'landed';
    const pegs = [];
    for (let r = 0; r < 10; r++) {
      const y = 96 + r * 36;
      const odd = r % 2 === 1;
      const xs = odd ? [69, 138, 207, 276] : [34, 103, 172, 241, 310];
      xs.forEach(x => {
        if (Math.abs(x - 178) < 36 && Math.abs(y - 205) < 34) return;
        pegs.push({ style: `position:absolute;left:${x - 6}px;top:${y - 6}px;width:12px;height:12px;box-sizing:border-box;border-radius:50%;background:#EFE6D8;border:3px solid #7A5A5A;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.85)` });
      });
    }
    const RAR = {
      Common: 'background:#EFE6D8;color:#8A6A6A',
      Rare: 'background:#BCDDF4;color:#3F4D5E',
      Epic: 'background:#E8E1FF;color:#6B4C82'
    };
    const raw = [
      { rar: 'Common', pct: '70%', bg: '#EFE6D8' },
      { rar: 'Rare', pct: '25%', bg: '#BCDDF4' },
      { rar: 'Epic', pct: '5%', bg: '#E8E1FF' }
    ];
    const baskets = raw.map(r => {
      const hit = landed && r.rar === 'Rare';
      return {
        ...r,
        cardStyle: `flex:1;min-width:0;height:150px;box-sizing:border-box;padding:8px 2px 8px;border-radius:18px 18px 0 0;background:#F8F2E8;display:flex;flex-direction:column;align-items:center;gap:3px;${hit ? 'box-shadow:inset 0 0 0 3px #7FC98C;' : ''}`,
        tileStyle: `width:64px;height:64px;border-radius:16px;background:${r.bg};display:flex;align-items:center;justify-content:center`,
        rarStyle: `height:16px;padding:0 6px;border-radius:999px;font-weight:900;font-size:10px;display:flex;align-items:center;${RAR[r.rar]}`
      };
    });
    return { landed, pegs, baskets };
  }
}
</script>
</body>
</html>
