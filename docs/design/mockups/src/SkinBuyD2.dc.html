<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skin buy D2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
body{margin:0}
button,a{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#F8F2E8;font-family:'Nunito',system-ui,sans-serif;color:#5A3B3B;display:flex;flex-direction:column;padding:22px 16px 0;gap:14px;overflow:hidden">

  <div style="display:flex;align-items:center;justify-content:space-between">
    <a href="HomeD2.dc.html" aria-label="Back" style="width:44px;height:44px;border-radius:50%;background:#FFFCF6;box-shadow:0 4px 10px -3px rgba(110,80,70,.16);display:flex;align-items:center;justify-content:center;text-decoration:none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>
    </a>
    <span style="font-weight:900;font-size:24px;color:#5A3B3B">Characters</span>
    <div style="display:flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 8px;border-radius:999px;background:#FFFCF6;box-shadow:0 4px 10px -3px rgba(110,80,70,.16);font-weight:900;font-size:16px">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F8D468" stroke="#E5A82A" stroke-width="2"></circle><circle cx="12" cy="12" r="5.5" fill="none" stroke="#E5A82A" stroke-width="2"></circle></svg>
      <span>{{coins}}</span>
    </div>
  </div>

  <div style="position:relative;box-sizing:border-box;border-radius:28px;background:#FFFCF6;box-shadow:0 12px 22px -12px rgba(110,80,70,.22);padding:14px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden">
    <div style="position:absolute;left:0;right:0;top:0;height:144px;background:#D7EBD2"></div>
    <div style="position:relative;width:118px;height:118px;border-radius:34px;background:#FFFCF6;box-shadow:0 10px 18px -10px rgba(110,80,70,.4);display:flex;align-items:center;justify-content:center">
      <dc-import name="HeadIcon" skin="capy" size="92" stroke="none" sw="0" hint-size="92px,92px"></dc-import>
      <span aria-hidden="true" style="position:absolute;right:-8px;top:-8px;width:34px;height:34px;border-radius:50%;background:#5A3B3B;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
    </div>
    <span style="position:relative;font-weight:900;font-size:22px">Capybara</span>
    <div style="position:relative;display:flex;align-items:center;gap:8px">
      <span style="height:28px;padding:0 12px;border-radius:999px;background:#BCDDF4;color:#3F4D5E;font-weight:900;font-size:14px;display:flex;align-items:center">Rare</span>
      <span style="display:flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 8px;border-radius:999px;background:#FBE19A;font-weight:900;font-size:14px"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F8D468" stroke="#E5A82A" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#E5A82A" stroke-width="2"/></svg><span>800 coins</span></span>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px">
    <sc-for list="{{tiles}}" as="s" hint-placeholder-count="6">
      <div style="{{s.cardStyle}}">
        <div style="{{s.bgStyle}}">
          <sc-if value="{{s.isHead}}" hint-placeholder-val="{{ false }}"><dc-import name="PlayerHead" skin="{{s.skin}}" glow="false" size="54" stroke="none" sw="0" hint-size="54px,54px"></dc-import></sc-if>
          <sc-if value="{{s.isMystery}}" hint-placeholder-val="{{ false }}"><span style="font-weight:900;font-size:34px;color:#8A6A6A">?</span></sc-if>
        </div>
        <span style="display:flex;align-items:center;gap:4px;font-weight:900;font-size:13px"><span>{{s.name}}</span><sc-if value="{{s.isHead}}" hint-placeholder-val="{{ true }}"><dc-import name="FoodIcon" skin="{{s.skin}}" size="14" stroke="none" sw="0" hint-size="14px,14px"></dc-import></sc-if></span>
        <span style="{{s.tagStyle}}">{{s.tag}}</span>
        <div style="{{s.checkStyle}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
      </div>
    </sc-for>
  </div>

  <div style="position:absolute;left:20px;right:20px;bottom:30px">
    <sc-if value="{{canBuy}}" hint-placeholder-val="{{ false }}">
      <a href="SkinsD3.dc.html" style="display:flex;align-items:center;justify-content:center;gap:10px;height:62px;border-radius:999px;background:#79D391;box-shadow:inset 0 -6px 0 #5DB878, 0 8px 14px -8px rgba(74,154,99,.6);text-decoration:none;color:#2F5B3F;font-weight:900;font-size:22px"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F8D468" stroke="#E5A82A" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#E5A82A" stroke-width="2"/></svg><span>Buy for 800</span></a>
    </sc-if>
    <sc-if value="{{needMore}}" hint-placeholder-val="{{ true }}">
      <div role="button" aria-disabled="true" aria-label="Buy for 800. Need 680 more coins." style="display:flex;align-items:center;justify-content:center;gap:10px;height:62px;border-radius:999px;background:#E3DCD2;color:#5A3B3B;font-weight:900;font-size:20px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Need 680 more coins</span></div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["needMore","canBuy"],"default":"needMore"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { name: 'Mango', kind: 'head', skin: 'snake', bg: '#DCE5FF', status: 'selected' },
      { name: 'Ginger', kind: 'head', skin: 'cat', bg: '#FBE3C8', status: 'owned' },
      { name: 'Pup', kind: 'head', skin: 'dog', bg: '#FBE7B0', status: 'owned' },
      { name: 'Tuxedo', kind: 'head', skin: 'tux', bg: '#D9DDF5', status: 'lock', cost: 300 },
      { name: 'Capy', kind: 'head', skin: 'capy', bg: '#D7EBD2', status: 'lock', cost: 800 },
      { name: 'Coming', kind: 'mystery', bg: '#E3DCD2', status: 'soon' },
      { name: 'Coming', kind: 'mystery', bg: '#E3DCD2', status: 'soon' },
      { name: 'Coming', kind: 'mystery', bg: '#E3DCD2', status: 'soon' }
    ];
    const tiles = raw.map(r => {
      const sel = r.status === 'selected';
      const dim = r.status === 'soon';
      return {
        ...r,
        isMeow: r.kind === 'meow',
        isHead: r.kind === 'head',
        isMystery: r.kind === 'mystery',
        cardStyle: `position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 8px;border-radius:20px;background:#FFFCF6;box-shadow:0 6px 12px -8px rgba(110,80,70,.22);${r.name === 'Capy' ? 'outline:3px solid #5A3B3B;' : ''}${dim ? 'opacity:.75;' : ''}`,
        bgStyle: `width:100%;height:74px;border-radius:14px;background:${r.bg};display:flex;align-items:center;justify-content:center;${r.status === 'lock' ? 'filter:grayscale(.35);' : ''}`,
        tag: sel ? 'Equipped' : r.status === 'owned' ? 'Owned' : r.status === 'lock' ? String(r.cost) + ' coins' : 'Soon',
        tagStyle: `font-weight:800;font-size:11px;color:${r.status === 'lock' ? '#8A5A00' : '#8A6A6A'}`,
        checkStyle: `position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;background:#5DB878;align-items:center;justify-content:center;display:${sel ? 'flex' : 'none'}`
      };
    });
    const canBuy = this.props.state === 'canBuy';
    return { tiles, canBuy, needMore: !canBuy, coins: canBuy ? 850 : 120 };
  }
}
</script>
</body>
</html>
