<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loadout D2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
.lt{font-family:'Lilita One',sans-serif;-webkit-text-stroke:9px #6B4C82;paint-order:stroke fill;line-height:.95;display:inline-block}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#F8F2E8;font-family:'Nunito',system-ui,sans-serif;color:#5A3B3B;display:flex;flex-direction:column;padding:22px 16px 0;gap:12px;overflow:hidden">

  <div style="display:flex;align-items:center;justify-content:space-between">
    <a href="HomeD2.dc.html" aria-label="Back" style="width:44px;height:44px;border-radius:50%;background:#FFFCF6;box-shadow:0 4px 10px -3px rgba(110,80,70,.15);display:flex;align-items:center;justify-content:center;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 5l-7 7 7 7"/></svg></a>
    <span style="font-weight:900;font-size:24px">{{title}}</span>
    <div style="width:44px" aria-hidden="true"></div>
  </div>

  <div style="display:flex;justify-content:space-between;box-sizing:border-box;padding:16px 8px 14px;border-radius:26px;background:#FFFCF6;box-shadow:0 10px 22px -12px rgba(110,80,70,.22)">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:150px">
        <div style="{{s1Style}}">
          <sc-if value="{{s1IsSlowmo}}" hint-placeholder-val="{{ false }}"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="8"/><path d="M12 9v4.8l3 1.8M9.5 3h5"/></svg></sc-if><sc-if value="{{s1IsSnip}}" hint-placeholder-val="{{ false }}"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="17.5" r="2.7"/><circle cx="17.5" cy="17.5" r="2.7"/><path d="M8.2 15.5L17 4M15.8 15.5L7 4"/></svg></sc-if>
          <sc-if value="{{s1IsLocked}}" hint-placeholder-val="{{ false }}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></sc-if>
          <sc-if value="{{s1IsEmpty}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="font-weight:900;font-size:30px;color:#8A6A6A;line-height:1">+</span></sc-if>
        </div>
        <span style="display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center">
          <span style="font-weight:800;font-size:12px;letter-spacing:.08em;color:#8A6A6A">SLOT 1</span>
          <span style="font-weight:900;font-size:15px;line-height:1.15">{{s1Name}}</span>
        </span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:150px">
        <div style="{{s2Style}}">
          <sc-if value="{{s2IsSlowmo}}" hint-placeholder-val="{{ false }}"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="8"/><path d="M12 9v4.8l3 1.8M9.5 3h5"/></svg></sc-if><sc-if value="{{s2IsSnip}}" hint-placeholder-val="{{ false }}"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="17.5" r="2.7"/><circle cx="17.5" cy="17.5" r="2.7"/><path d="M8.2 15.5L17 4M15.8 15.5L7 4"/></svg></sc-if>
          <sc-if value="{{s2IsLocked}}" hint-placeholder-val="{{ false }}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></sc-if>
          <sc-if value="{{s2IsEmpty}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="font-weight:900;font-size:30px;color:#8A6A6A;line-height:1">+</span></sc-if>
        </div>
        <span style="display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center">
          <span style="font-weight:800;font-size:12px;letter-spacing:.08em;color:#8A6A6A">SLOT 2</span>
          <span style="font-weight:900;font-size:15px;line-height:1.15">{{s2Name}}</span>
        </span>
      </div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
    <button type="button" role="switch" aria-checked="{{startAria}}" aria-label="Start at checkpoint level 6. Switch off to start at level 1." onClick="{{toggleStart}}" style="height:44px;padding:0 12px 0 14px;border-radius:999px;border:0;background:#FFFCF6;box-shadow:0 4px 10px -3px rgba(110,80,70,.15);display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:#5A3B3B">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4M6 4h12l-3 4.5L18 13H6"/></svg>
      <span>{{startText}}</span>
      <span style="{{trackStyle}}"><span style="{{knobStyle}}"></span></span>
    </button>
    <div style="height:44px;box-sizing:border-box;padding:0 16px 0 12px;border-radius:999px;background:#FFFCF6;box-shadow:0 4px 10px -3px rgba(110,80,70,.15);display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#3CC6DA" aria-hidden="true"><path d="M13 2L5 13.5h6L10 22l9-12.5h-6.5L13 2z"/></svg>
      <span>Start energy 25</span>
    </div>
  </div>
  <div style="margin-top:-4px;text-align:center;font-weight:800;font-size:12px;color:#8A6A6A">Energy carries over from your last run</div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <button type="button" onClick="{{slowmoPick}}" aria-pressed="{{slowmoPressed}}" aria-label="Slow-mo, costs 40 energy. Slower snake for 4 s; mango and obstacle timers keep real time" style="{{slowmoCard}}">
      <span style="flex:none;width:52px;height:52px;border-radius:50%;background:#BCDDF4;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="8"/><path d="M12 9v4.8l3 1.8M9.5 3h5"/></svg></span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left">
        <span style="display:flex;align-items:center;gap:8px"><span style="font-weight:900;font-size:17px;line-height:1">Slow-mo</span><span style="display:flex;align-items:center;gap:3px;height:22px;padding:0 8px 0 6px;border-radius:999px;background:#E6F5F8;font-weight:900;font-size:13px;color:#3F4D5E"><svg width="11" height="11" viewBox="0 0 24 24" fill="#3CC6DA" aria-hidden="true"><path d="M13 2L5 13.5h6L10 22l9-12.5h-6.5L13 2z"/></svg><span>40</span></span></span>
        <span style="font-weight:800;font-size:13px;line-height:1.2;color:#8A6A6A">Slower snake 4 s · timers keep real time</span>
      </span>
      <sc-if value="{{slowmoSel}}" hint-placeholder-val="{{ false }}"><span style="flex:none;height:26px;padding:0 10px;border-radius:999px;background:#79D391;color:#234B35;font-weight:900;font-size:12px;display:flex;align-items:center">{{slowmoSlotText}}</span></sc-if>
    </button>
    <button type="button" onClick="{{snipPick}}" aria-pressed="{{snipPressed}}" aria-label="Tail Snip, costs 30 energy. Cuts the back half; the cut part is a rock wall for 3 s" style="{{snipCard}}">
      <span style="flex:none;width:52px;height:52px;border-radius:50%;background:#F6C2D3;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="17.5" r="2.7"/><circle cx="17.5" cy="17.5" r="2.7"/><path d="M8.2 15.5L17 4M15.8 15.5L7 4"/></svg></span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left">
        <span style="display:flex;align-items:center;gap:8px"><span style="font-weight:900;font-size:17px;line-height:1">Tail Snip</span><span style="display:flex;align-items:center;gap:3px;height:22px;padding:0 8px 0 6px;border-radius:999px;background:#E6F5F8;font-weight:900;font-size:13px;color:#3F4D5E"><svg width="11" height="11" viewBox="0 0 24 24" fill="#3CC6DA" aria-hidden="true"><path d="M13 2L5 13.5h6L10 22l9-12.5h-6.5L13 2z"/></svg><span>30</span></span></span>
        <span style="font-weight:800;font-size:13px;line-height:1.2;color:#8A6A6A">Cut back half · rock wall for 3 s</span>
      </span>
      <sc-if value="{{snipSel}}" hint-placeholder-val="{{ false }}"><span style="flex:none;height:26px;padding:0 10px;border-radius:999px;background:#79D391;color:#234B35;font-weight:900;font-size:12px;display:flex;align-items:center">{{snipSlotText}}</span></sc-if>
    </button>
    <div role="group" aria-label="Shield, locked. Unlocks at L11" style="display:flex;align-items:center;gap:12px;height:80px;box-sizing:border-box;padding:0 14px 0 14px;border-radius:22px;background:#EFE6D8">
      <span style="flex:none;width:52px;height:52px;border-radius:50%;background:#E3DCD2;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px">
        <span style="font-weight:900;font-size:17px;line-height:1;color:#5A3B3B">Shield</span>
        <span style="display:flex;align-items:center;gap:5px;font-weight:800;font-size:13px;line-height:1.2;color:#5A3B3B"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Unlocks at L11</span></span>
      </span>
    </div>
    <div role="group" aria-label="Mango Rain, locked. Unlocks at L16" style="display:flex;align-items:center;gap:12px;height:80px;box-sizing:border-box;padding:0 14px 0 14px;border-radius:22px;background:#EFE6D8">
      <span style="flex:none;width:52px;height:52px;border-radius:50%;background:#E3DCD2;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px">
        <span style="font-weight:900;font-size:17px;line-height:1;color:#5A3B3B">Mango Rain</span>
        <span style="display:flex;align-items:center;gap:5px;font-weight:800;font-size:13px;line-height:1.2;color:#5A3B3B"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Unlocks at L16</span></span>
      </span>
    </div>
  </div>

  <a href="CountdownD2.dc.html" style="position:absolute;left:20px;right:20px;bottom:30px;display:flex;align-items:center;justify-content:center;height:78px;border-radius:999px;background:#79D391;box-shadow:inset 0 -7px 0 #5DB878, inset 0 4px 0 rgba(255,255,255,.4), 0 6px 0 #4A9A63;text-decoration:none"><span class="lt" style="font-size:46px;color:#FFFFFF;-webkit-text-stroke:8px #3E7A52">Go!</span></a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["firstSkillOnly","twoSlots"],"default":"twoSlots"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.state ?? 'twoSlots';
    const max = mode === 'firstSkillOnly' ? 1 : 2;
    const st = this.state || {};
    let picked = (st.picked ?? (max === 1 ? ['slowmo'] : ['slowmo', 'snip'])).slice(-max);
    const startL6 = st.startL6 !== false;
    const names = { slowmo: 'Slow-mo', snip: 'Tail Snip' };
    const pick = (id) => () => {
      let p = picked.slice();
      if (p.includes(id)) p = p.filter((x) => x !== id);
      else { p.push(id); while (p.length > max) p.shift(); }
      this.setState({ picked: p });
    };
    const out = {
      title: max === 1 ? 'Pick your skill' : 'Pick 2 skills',
      startAria: startL6 ? 'true' : 'false',
      startText: startL6 ? 'Start at L6' : 'Start at L1',
      toggleStart: () => this.setState({ startL6: !startL6 }),
      trackStyle: `position:relative;flex:none;width:42px;height:24px;border-radius:12px;box-sizing:border-box;background:${startL6 ? '#79D391' : '#EFE6D8'};box-shadow:inset 0 0 0 2px ${startL6 ? '#4A9A63' : '#8A6A6A'}`,
      knobStyle: `position:absolute;top:3px;left:${startL6 ? 21 : 3}px;width:18px;height:18px;border-radius:50%;background:${startL6 ? '#FFFFFF' : '#8A6A6A'};box-shadow:0 1px 2px rgba(90,59,59,.3)`
    };
    ['slowmo', 'snip'].forEach((id) => {
      const idx = picked.indexOf(id);
      const sel = idx >= 0;
      out[id + 'Pick'] = pick(id);
      out[id + 'Pressed'] = sel ? 'true' : 'false';
      out[id + 'Sel'] = sel;
      out[id + 'SlotText'] = 'Slot ' + (idx + 1);
      out[id + 'Card'] = `display:flex;align-items:center;gap:12px;width:100%;height:80px;box-sizing:border-box;padding:0 14px;border:0;border-radius:22px;background:#FFFCF6;color:#5A3B3B;font-family:inherit;cursor:pointer;box-shadow:${sel ? '0 0 0 3px #7FC98C, ' : ''}0 6px 12px -8px rgba(110,80,70,.22)`;
    });
    [1, 2].forEach((n) => {
      const locked = n === 2 && max === 1;
      const id = picked[n - 1];
      const p = 's' + n;
      out[p + 'IsSlowmo'] = !locked && id === 'slowmo';
      out[p + 'IsSnip'] = !locked && id === 'snip';
      out[p + 'IsLocked'] = locked;
      out[p + 'IsEmpty'] = !locked && !id;
      out[p + 'Name'] = locked ? 'Unlocks at L6' : id ? names[id] : 'Empty';
      const base = 'width:84px;height:84px;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;';
      out[p + 'Style'] = locked ? base + 'background:#EFE6D8;box-shadow:inset 0 0 0 3px #E3DCD2'
        : id ? base + 'background:#FFFCF6;box-shadow:0 7px 0 rgba(80,140,180,.3), 0 0 0 7px rgba(255,233,138,.85)'
        : base + 'background:#F8F2E8;box-shadow:inset 0 0 0 3px #B79F8A;border:0';
    });
    return out;
  }
}
</script>
</body>
</html>
