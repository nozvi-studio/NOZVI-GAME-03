<script type="text/x-dc" data-dc-script data-props='{"skin":{"editor":"enum","options":["snake","cat","dog","capy"],"default":"snake"},"skill":{"editor":"enum","options":["slowmo","tailsnip","shield","mangorain"],"default":"slowmo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = 21;
    const skin = this.props.skin ?? 'snake';
    const fur = skin;
    const T = { snake: ['#6F93F5', '#3F63D1'], cat: ['#F4A157', '#DB8238'], dog: ['#E9B87F', '#C48A4F'], capy: ['#C79A6B', '#A8794D'] }[skin] ?? ['#6F93F5', '#3F63D1'];
    const ctr = (c, r) => [c * C + C / 2, r * C + C / 2];
    const smooth = (pts, r) => {
      let d = `M${pts[0][0]} ${pts[0][1]}`;
      for (let i = 1; i < pts.length - 1; i++) {
        const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
        const l1 = Math.hypot(px - x, py - y), l2 = Math.hypot(nx - x, ny - y);
        const rr = Math.min(r, l1 / 2, l2 / 2);
        d += ` L${x + (px - x) / l1 * rr} ${y + (py - y) / l1 * rr} Q${x} ${y} ${x + (nx - x) / l2 * rr} ${y + (ny - y) / l2 * rr}`;
      }
      const l = pts[pts.length - 1];
      return d + ` L${l[0]} ${l[1]}`;
    };
    const pts = (this.props.skill === 'tailsnip' ? [[9, 12], [9, 10], [11, 10]] : [[7, 12], [9, 12], [9, 10], [11, 10]]).map(([c, r]) => ctr(c, r));
    const head = pts[pts.length - 1];
    return {
      fur,
      skin,
      is_slowmo: (this.props.skill ?? 'slowmo') === 'slowmo',
      is_tailsnip: this.props.skill === 'tailsnip',
      is_shield: this.props.skill === 'shield',
      is_mangorain: this.props.skill === 'mangorain',
      energyText: { slowmo: 35, tailsnip: 5, shield: 25, mangorain: 15 }[this.props.skill ?? 'slowmo'],
      lvText: { slowmo: 'Level 9', tailsnip: 'Level 9', shield: 'Level 12', mangorain: 'Level 17' }[this.props.skill ?? 'slowmo'],
      cpText: { slowmo: 'L10', tailsnip: 'L10', shield: 'L15', mangorain: 'L20' }[this.props.skill ?? 'slowmo'],
      biomeText: { slowmo: 'Rice Paddy', tailsnip: 'Rice Paddy', shield: 'Frozen Pond', mangorain: 'Rocky Hills' }[this.props.skill ?? 'slowmo'],
      costText: { slowmo: 40, tailsnip: 30, shield: 50, mangorain: 80 }[this.props.skill ?? 'slowmo'],
      trail: T[0],
      trailDark: T[1],
      snakePath: smooth(pts, 10),
      headStyle: `position:absolute;left:${head[0] - 20}px;top:${head[1] - 22}px`
    };
  }
}
</script>
