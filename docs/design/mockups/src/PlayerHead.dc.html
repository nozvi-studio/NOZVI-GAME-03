<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlayerHead</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0}

</style>
</helmet>
<div style="{{rootStyle}}">
  <svg width="{{px}}" height="{{px}}" viewBox="0 0 48 48" aria-hidden="true" style="display:block;overflow:visible">
    <defs>
      <radialGradient id="rg-{{skin}}" cx="50%" cy="28%" r="78%"><stop offset="0" stop-color="{{c1}}"/><stop offset="1" stop-color="{{c2}}"/></radialGradient>
      <radialGradient id="rh-{{skin}}"><stop offset="0" stop-color="#FFE98A" stop-opacity=".95"/><stop offset="1" stop-color="#FFE98A" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="24" cy="26" r="30" fill="url(#rh-{{skin}})" opacity="{{halo}}"><animate attributeName="r" values="27;33;27" dur="2.4s" repeatCount="indefinite"/></circle>
    <!-- 1 ears -->
    <path d="{{earsD}}" fill="{{earFill}}" opacity="{{earsOp}}" stroke="{{stroke}}" stroke-width="{{sw}}" stroke-linejoin="round"/>
    <path d="{{earsInD}}" fill="#F7A9B8" opacity="{{earsInOp}}"/>
    <!-- 2 head -->
    <path d="{{headD}}" fill="url(#rg-{{skin}})" stroke="{{stroke}}" stroke-width="{{sw}}" stroke-linejoin="round"/>
    <!-- 3 marks -->
    <path d="{{m1d}}" fill="{{m1fill}}" stroke="{{m1stroke}}" stroke-width="{{m1sw}}" stroke-linecap="round" opacity="{{m1op}}"/>
    <path d="{{m2d}}" fill="{{m2fill}}" stroke="{{m2stroke}}" stroke-width="{{m2sw}}" stroke-linecap="round" opacity="{{m2op}}"/>
    <!-- 4 muzzle + cheeks -->
    <ellipse cx="{{mzCx}}" cy="{{mzCy}}" rx="{{mzRx}}" ry="{{mzRy}}" fill="{{mzFill}}" opacity="{{mzOp}}"/>
    <ellipse cx="{{chL}}" cy="{{chY}}" rx="{{chRx}}" ry="{{chRy}}" fill="{{chFill}}" opacity="{{chOp}}"/>
    <ellipse cx="{{chR}}" cy="{{chY}}" rx="{{chRx}}" ry="{{chRy}}" fill="{{chFill}}" opacity="{{chOp}}"/>
    <!-- 5 tongue (root = mouth anchor, drawn under the lip line) -->
    <path d="{{tongueD}}" fill="{{tongueFill}}" stroke="{{tongueStroke}}" stroke-width="{{tongueSw}}" stroke-linecap="round" stroke-linejoin="round" opacity="{{tongueOp}}"/>
    <!-- 6 nose -->
    <path d="{{noseD}}" fill="{{noseFill}}"/>
    <!-- 7 mouth: idle / eat / dead, all hung on mouthY -->
    <path d="{{mouthD}}" fill="none" stroke="{{mouthStroke}}" stroke-width="{{mouthSw}}" stroke-linecap="round" stroke-linejoin="round" opacity="{{mouthIdleOp}}"/>
    <g transform="{{mouthAt}}" opacity="{{eatOp}}"><path d="M-4.6 -0.8Q0 -2.2 4.6 -0.8Q4.2 5.8 0 5.8Q-4.2 5.8 -4.6 -0.8z" fill="#6B2B3A"/><path d="M-2.3 4.2q2.3-2.2 4.6 0q-1 1.7-2.3 1.7T-2.3 4.2z" fill="#F07C93"/></g>
    <g transform="{{mouthAt}}" opacity="{{deadMouthOp}}"><path d="M-3.8 1.4q1.9-2.2 3.8 0t3.8 0" fill="none" stroke="#4A2E3E" stroke-width="1.2" stroke-linecap="round"/></g>
    <path d="{{whiskD}}" fill="none" stroke="#8A6A5A" stroke-width="1" stroke-linecap="round" opacity="{{whiskOp}}"/>
    <!-- 8 eyes -->
    <g opacity="{{eyeOp}}">
      <g transform="translate({{eLx}} {{eY}})">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 .12;1 1;1 1" keyTimes="0;.9;.935;.97;1" dur="4.5s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="0" rx="{{scRx}}" ry="{{scRy}}" fill="{{scFill}}" opacity="{{scOp}}"/>
          <g>
            <animateTransform attributeName="transform" type="translate" values="{{wanderVals}}" keyTimes="0;.15;.35;.55;.75;.88;1" dur="6s" repeatCount="indefinite"/>
            <ellipse cx="0" cy="{{pDy}}" rx="{{pRx}}" ry="{{pRy}}" fill="{{pFill}}"/>
            <circle cx="{{h1x}}" cy="{{h1y}}" r="{{h1r}}" fill="#FFFFFF" opacity="{{h1op}}"/>
            <circle cx="{{h2x}}" cy="{{h2y}}" r="{{h2r}}" fill="#FFFFFF" opacity="{{h2op}}"/>
          </g>
        </g>
      </g>
      <g transform="translate({{eRx}} {{eY}})">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 .12;1 1;1 1" keyTimes="0;.9;.935;.97;1" dur="4.5s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="0" rx="{{scRx}}" ry="{{scRy}}" fill="{{scFill}}" opacity="{{scOp}}"/>
          <g>
            <animateTransform attributeName="transform" type="translate" values="{{wanderVals}}" keyTimes="0;.15;.35;.55;.75;.88;1" dur="6s" repeatCount="indefinite"/>
            <ellipse cx="0" cy="{{pDy}}" rx="{{pRx}}" ry="{{pRy}}" fill="{{pFill}}"/>
            <circle cx="{{h1x}}" cy="{{h1y}}" r="{{h1r}}" fill="#FFFFFF" opacity="{{h1op}}"/>
            <circle cx="{{h2x}}" cy="{{h2y}}" r="{{h2r}}" fill="#FFFFFF" opacity="{{h2op}}"/>
          </g>
        </g>
      </g>
    </g>
    <g opacity="{{xOp}}" fill="none" stroke="#1E1B2E" stroke-width="2.2" stroke-linecap="round">
      <ellipse cx="{{eLx}}" cy="{{eY}}" rx="{{xRx}}" ry="{{xRy}}" fill="#FFF7D6" stroke="none"/>
      <g transform="translate({{eLx}} {{eY}})"><path d="M-3.2 -3.2l6.4 6.4M3.2 -3.2l-6.4 6.4"/></g>
      <ellipse cx="{{eRx}}" cy="{{eY}}" rx="{{xRx}}" ry="{{xRy}}" fill="#FFF7D6" stroke="none"/>
      <g transform="translate({{eRx}} {{eY}})"><path d="M-3.2 -3.2l6.4 6.4M3.2 -3.2l-6.4 6.4"/></g>
    </g>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"skin":{"editor":"enum","options":["snake","cat","tux","cream","dog","capy"],"default":"snake"},"state":{"editor":"enum","options":["idle","eat","dead"],"default":"idle"},"size":{"editor":"text","default":"64"},"glow":{"editor":"boolean","default":true},"eyes":{"editor":"enum","options":["normal","x"],"default":"normal"},"stroke":{"editor":"text","default":"none"},"sw":{"editor":"text","default":"0"},"$preview":{"width":120,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    // ---------- SKIN RECORDS (the only thing that changes per skin) ----------
    // c: face gradient [light, base]   head/ears/marks: SVG path data in the 48 box
    // muzzle/cheeks/eyes/nose/mouth/tongue: parameters placed on the shared anchors
    const SKINS = {
      snake: {
        c: ['#A9C0FF', '#5E86F2'],
        head: 'M24 4.6C35.6 4.6 44 12.4 44 23.8 44 35 36 43 24 44.6 12 43 4 35 4 23.8 4 12.4 12.4 4.6 24 4.6z',
        marks: [
          { d: 'M24 7.8l3 3-3 3-3-3zM17 12.6l2.2 2.2-2.2 2.2-2.2-2.2zM31 12.6l2.2 2.2-2.2 2.2-2.2-2.2z', fill: '#3F63D1', op: 0.5 },
          { d: 'M8.4 21.2l1.6 1.6-1.6 1.6-1.6-1.6zM39.6 21.2l1.6 1.6-1.6 1.6-1.6-1.6z', fill: '#3F63D1', op: 0.35 }
        ],
        muzzle: { cx: 24, cy: 35.4, rx: 11.5, ry: 7.6, fill: '#E4ECFF', op: 1 },
        cheeks: { y: 30.6, dx: 14.5, rx: 2.6, ry: 1.7, fill: '#FF8FA3', op: 0.45 },
        eyes: { y: 23, dx: 8.5, sc: { rx: 5.8, ry: 6.2, fill: '#FFF7D6' }, p: { rx: 1.8, ry: 4.8, fill: '#1E1B2E', dy: 0.3 }, hl: [{ x: -1.9, y: -2.4, r: 1.3, op: 1 }], wander: 1.3 },
        nose: { d: 'M21 33.6a.9 1.2 0 1 0 1.8 0a.9 1.2 0 1 0 -1.8 0zM25.2 33.6a.9 1.2 0 1 0 1.8 0a.9 1.2 0 1 0 -1.8 0z', fill: '#2B3A73' },
        mouth: { d: 'M17.8 37.4Q24 42.4 30.2 37.4', stroke: '#2B3A73', sw: 1.3 },
        mouthY: 38,
        tongue: { d: 'M24 40V44M24 44l-2.4 2.4M24 44l2.4 2.4', fill: 'none', stroke: '#F0607A', sw: 1.9, showEat: false }
      },
      cat: {
        c: ['#FFCB93', '#F4A157'], earFill: '#F4A157',
        ears: 'M4.5 21L6.5 3 20 11.5zM43.5 21L41.5 3 28 11.5z', earsInner: 'M8.6 16.5L9.6 7.6 16.4 11.8zM39.4 16.5L38.4 7.6 31.6 11.8z',
        head: 'M4 27.5a20 17 0 1 0 40 0a20 17 0 1 0 -40 0z',
        marks: [{ d: 'M20.8 13v4M24 11.6v5M27.2 13v4', stroke: '#D9742A', sw: 1.7, op: 1 }],
        muzzle: { cx: 24, cy: 35, rx: 9.5, ry: 6.4, fill: '#FFFFFF', op: 0.95 },
        cheeks: { y: 33.5, dx: 15, rx: 3.2, ry: 2.2, fill: '#FF8FA3', op: 0.5 },
        eyes: { y: 28, dx: 9, sc: { rx: 6.3, ry: 7.2, fill: '#FFFFFF' }, p: { rx: 4.7, ry: 4.7, fill: '#1E1B2E', dy: 0.4 }, hl: [{ x: -1.5, y: -1.8, r: 1.8, op: 1 }, { x: 1.7, y: 2.3, r: 0.9, op: 0.85 }], wander: 1.6 },
        nose: { d: 'M22 34.2h4l-2 2.5z', fill: '#F07C93' },
        mouth: { d: 'M24 36.7v1.2M24 37.9q-2.6 2.6-5 0M24 37.9q2.6 2.6 5 0', stroke: '#7A4A3A', sw: 1.2 },
        mouthY: 37.9,
        whiskers: 'M9 36l-6.5-1.6M9 38.4l-6 2M39 36l6.5-1.6M39 38.4l6 2'
      },
      tux: {
        c: ['#55546C', '#2E2D3E'], earFill: '#2E2D3E',
        ears: 'M4.5 21L6.5 3 20 11.5zM43.5 21L41.5 3 28 11.5z', earsInner: 'M8.6 16.5L9.6 7.6 16.4 11.8zM39.4 16.5L38.4 7.6 31.6 11.8z',
        head: 'M4 27.5a20 17 0 1 0 40 0a20 17 0 1 0 -40 0z',
        marks: [{ d: 'M24 12q-4.6 7-4.2 14h8.4q.4-7-4.2-14z', fill: '#FFFFFF', op: 1 }],
        muzzle: { cx: 24, cy: 35, rx: 9.5, ry: 6.4, fill: '#FFFFFF', op: 0.95 },
        cheeks: { y: 33.5, dx: 15, rx: 3.2, ry: 2.2, fill: '#FF8FA3', op: 0.5 },
        eyes: { y: 28, dx: 9, sc: { rx: 6.3, ry: 7.2, fill: '#FFFFFF' }, p: { rx: 4.7, ry: 4.7, fill: '#1E1B2E', dy: 0.4 }, hl: [{ x: -1.5, y: -1.8, r: 1.8, op: 1 }, { x: 1.7, y: 2.3, r: 0.9, op: 0.85 }], wander: 1.6 },
        nose: { d: 'M22 34.2h4l-2 2.5z', fill: '#F07C93' },
        mouth: { d: 'M24 36.7v1.2M24 37.9q-2.6 2.6-5 0M24 37.9q2.6 2.6 5 0', stroke: '#7A4A3A', sw: 1.2 },
        mouthY: 37.9,
        whiskers: 'M9 36l-6.5-1.6M9 38.4l-6 2M39 36l6.5-1.6M39 38.4l6 2'
      },
      cream: {
        c: ['#FFF0D2', '#EBCB98'], earFill: '#EBCB98',
        ears: 'M4.5 21L6.5 3 20 11.5zM43.5 21L41.5 3 28 11.5z', earsInner: 'M8.6 16.5L9.6 7.6 16.4 11.8zM39.4 16.5L38.4 7.6 31.6 11.8z',
        head: 'M4 27.5a20 17 0 1 0 40 0a20 17 0 1 0 -40 0z',
        marks: [{ d: 'M20.8 13v4M24 11.6v5M27.2 13v4', stroke: '#C99A58', sw: 1.7, op: 1 }],
        muzzle: { cx: 24, cy: 35, rx: 9.5, ry: 6.4, fill: '#FFFFFF', op: 0.95 },
        cheeks: { y: 33.5, dx: 15, rx: 3.2, ry: 2.2, fill: '#FF8FA3', op: 0.5 },
        eyes: { y: 28, dx: 9, sc: { rx: 6.3, ry: 7.2, fill: '#FFFFFF' }, p: { rx: 4.7, ry: 4.7, fill: '#1E1B2E', dy: 0.4 }, hl: [{ x: -1.5, y: -1.8, r: 1.8, op: 1 }, { x: 1.7, y: 2.3, r: 0.9, op: 0.85 }], wander: 1.6 },
        nose: { d: 'M22 34.2h4l-2 2.5z', fill: '#F07C93' },
        mouth: { d: 'M24 36.7v1.2M24 37.9q-2.6 2.6-5 0M24 37.9q2.6 2.6 5 0', stroke: '#7A4A3A', sw: 1.2 },
        mouthY: 37.9,
        whiskers: 'M9 36l-6.5-1.6M9 38.4l-6 2M39 36l6.5-1.6M39 38.4l6 2'
      },
      dog: {
        c: ['#F3CB98', '#E9B87F'], earFill: '#7A4A2B',
        ears: 'M1.5 23a6 11.4 14 1 0 12 0a6 11.4 14 1 0 -12 0zM34.5 23a6 11.4 -14 1 0 12 0a6 11.4 -14 1 0 -12 0z',
        head: 'M5.4 25a18.6 18.6 0 1 0 37.2 0a18.6 18.6 0 1 0 -37.2 0z',
        marks: [],
        muzzle: { cx: 24, cy: 33, rx: 9.6, ry: 7, fill: '#FFF1DC', op: 1 },
        cheeks: { y: 31, dx: 16.5, rx: 2.8, ry: 1.9, fill: '#FF8FA3', op: 0.4 },
        eyes: { y: 21.5, dx: 8, sc: null, p: { rx: 3.3, ry: 3.3, fill: '#17261B', dy: 0 }, hl: [{ x: 1.1, y: -1.3, r: 1.2, op: 1 }], wander: 0.9 },
        nose: { d: 'M20.2 29.8a3.8 2.8 0 1 0 7.6 0a3.8 2.8 0 1 0 -7.6 0z', fill: '#17261B' },
        mouth: { d: 'M24 32.6v2.4M19.8 35.2c2.4 2.4 6 2.4 8.4 0', stroke: '#7A3E22', sw: 1.4 },
        mouthY: 35.2,
        tongue: { d: 'M22.2 37.4q1.8 4.4 3.6 0z', fill: '#FF7A90', stroke: 'none', sw: 0, showEat: false }
      },
      capy: {
        c: ['#D6AB7C', '#C79A6B'], earFill: '#B1865A',
        ears: 'M5.9 11.4a5.5 5.5 0 1 0 11 0a5.5 5.5 0 1 0 -11 0zM31.1 11.4a5.5 5.5 0 1 0 11 0a5.5 5.5 0 1 0 -11 0z',
        head: 'M20.4 9.6H27.6A16.8 16.8 0 0 1 44.4 26.4V27.6A16.8 16.8 0 0 1 27.6 44.4H20.4A16.8 16.8 0 0 1 3.6 27.6V26.4A16.8 16.8 0 0 1 20.4 9.6z',
        marks: [],
        muzzle: { cx: 24, cy: 34, rx: 12.6, ry: 8.4, fill: '#B1865A', op: 1 },
        cheeks: { y: 30, dx: 15, rx: 2.9, ry: 2, fill: '#FF8FA3', op: 0.45 },
        eyes: { y: 20.4, dx: 9.6, sc: null, p: { rx: 3, ry: 3, fill: '#17261B', dy: 0 }, hl: [{ x: 0.9, y: -1.2, r: 1.1, op: 1 }], wander: 0.9 },
        nose: { d: 'M18.6 30.6a2 2.6 0 1 0 4 0a2 2.6 0 1 0 -4 0zM25.4 30.6a2 2.6 0 1 0 4 0a2 2.6 0 1 0 -4 0z', fill: '#4A2E1B' },
        mouth: { d: 'M20.4 37.6q3.6 2.8 7.2 0', stroke: '#4A2E1B', sw: 1.4 },
        mouthY: 37.6
      }
    };
    const ALIAS = { ginger: 'cat', meow: 'cat' };
    let id = this.props.skin ?? 'snake';
    id = ALIAS[id] ?? id;
    const S = SKINS[id] ?? SKINS.snake;
    if (!SKINS[id]) id = 'snake';
    const px = Number(this.props.size ?? 64) || 64;
    let state = this.props.state ?? 'idle';
    if (this.props.eyes === 'x') state = 'dead';
    const idle = state === 'idle', eat = state === 'eat', dead = state === 'dead';
    const glowOff = this.props.glow === false || this.props.glow === 'false';

    // ---------- shared layer slots (opacity 0 = layer unused by this skin) ----------
    const m = (i) => {
      const k = S.marks[i];
      return k ? { d: k.d, fill: k.fill ?? 'none', stroke: k.stroke ?? 'none', sw: k.sw ?? 0, op: k.op ?? 1 } : { d: 'M0 0', fill: 'none', stroke: 'none', sw: 0, op: 0 };
    };
    const m1 = m(0), m2 = m(1);
    const mz = S.muzzle, ch = S.cheeks, E = S.eyes;
    const ex = [24 - E.dx, 24 + E.dx];
    const w = E.wander;
    const wv = `0 0;${-w} ${w * 0.25};${-w} ${w * 0.25};${w} 0;${w} 0;0 ${-w * 0.5};0 0`;
    const hl = E.hl;
    const T = S.tongue;
    const tongueOn = !!T && !(eat && T.showEat === false);
    return {
      skin: id,
      px,
      c1: S.c[0], c2: S.c[1],
      halo: glowOff ? 0 : 1,
      stroke: this.props.stroke ?? 'none',
      sw: Number(this.props.sw ?? 0) || 0,
      rootStyle: `width:${px}px;height:${px}px;line-height:0`,
      // layers
      earsD: S.ears ?? 'M0 0', earsOp: S.ears ? 1 : 0, earFill: S.earFill ?? '#000',
      earsInD: S.earsInner ?? 'M0 0', earsInOp: S.earsInner ? 1 : 0,
      headD: S.head,
      m1d: m1.d, m1fill: m1.fill, m1stroke: m1.stroke, m1sw: m1.sw, m1op: m1.op,
      m2d: m2.d, m2fill: m2.fill, m2stroke: m2.stroke, m2sw: m2.sw, m2op: m2.op,
      mzCx: mz.cx, mzCy: mz.cy, mzRx: mz.rx, mzRy: mz.ry, mzFill: mz.fill, mzOp: mz.op,
      chY: ch.y, chL: 24 - ch.dx, chR: 24 + ch.dx, chRx: ch.rx, chRy: ch.ry, chFill: ch.fill, chOp: ch.op,
      tongueD: T ? T.d : 'M0 0', tongueFill: T ? T.fill : 'none', tongueStroke: T ? T.stroke : 'none', tongueSw: T ? T.sw : 0, tongueOp: tongueOn ? 1 : 0,
      noseD: S.nose.d, noseFill: S.nose.fill,
      mouthD: S.mouth.d, mouthStroke: S.mouth.stroke, mouthSw: S.mouth.sw, mouthIdleOp: idle ? 1 : 0,
      mouthAt: `translate(24 ${S.mouthY})`, eatOp: eat ? 1 : 0, deadMouthOp: dead ? 1 : 0,
      whiskD: S.whiskers ?? 'M0 0', whiskOp: S.whiskers ? 0.55 : 0,
      // eyes
      eyeOp: dead ? 0 : 1, xOp: dead ? 1 : 0,
      eLx: ex[0], eRx: ex[1], eY: E.y,
      scOp: E.sc ? 1 : 0, scRx: E.sc ? E.sc.rx : 1, scRy: E.sc ? E.sc.ry : 1, scFill: E.sc ? E.sc.fill : '#FFFFFF',
      pRx: E.p.rx, pRy: E.p.ry, pDy: E.p.dy, pFill: E.p.fill,
      h1x: hl[0].x, h1y: hl[0].y, h1r: hl[0].r, h1op: hl[0].op,
      h2x: hl[1] ? hl[1].x : 0, h2y: hl[1] ? hl[1].y : 0, h2r: hl[1] ? hl[1].r : 0.1, h2op: hl[1] ? hl[1].op : 0,
      wanderVals: wv,
      xr1: -3, xRx: E.sc ? E.sc.rx : E.p.rx + 1.6, xRy: E.sc ? E.sc.ry : E.p.ry + 1.6
    };
  }
}
</script>
</body>
</html>
