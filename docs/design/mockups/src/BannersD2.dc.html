<x-dc>

</style>
</helmet>

  <div style="align-self:center;box-sizing:border-box;width:369px;padding:6px;border-radius:26px;background:#FFFCF6;box-shadow:0 10px 22px -10px rgba(110,80,70,.22)">

    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="position:relative;width:84px;height:84px"><button aria-label="Tail Snip, costs 30 energy" style="width:84px;height:84px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:#FFFCF6;box-shadow:0 7px 0 rgba(80,140,180,.3), 0 0 0 7px rgba(255,233,138,.85);"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="17.5" r="2.7"/><circle cx="17.5" cy="17.5" r="2.7"/><path d="M8.2 15.5L17 4M15.8 15.5L7 4"/></svg></button></div><span style="display:flex;align-items:center;gap:4px;height:26px;padding:0 10px 0 8px;border-radius:999px;background:#FFFCF6;font-weight:800;font-size:14px;color:#5A3B3B"><svg width="12" height="12" viewBox="0 0 24 24" fill="#3CC6DA" aria-hidden="true"><path d="M13 2L5 13.5h6L10 22l9-12.5h-6.5L13 2z"/></svg><span>30</span></span></div>

  <sc-if value="{{isLevelUp}}" hint-placeholder-val="{{ true }}">
    <div role="status" style="position:absolute;left:36px;right:36px;box-sizing:border-box;border-radius:26px;box-shadow:0 14px 24px -10px rgba(90,59,59,.45);display:flex;flex-direction:column;align-items:center;top:196px;padding:16px 20px 16px;background:#FFFCF6;gap:4px">
      <span class="lt" style="font-size:50px;color:#F8D468;-webkit-text-stroke:9px #6B4C82;filter:drop-shadow(0 4px 0 #6B4C82)">Level 8</span>

      <span style="display:flex;align-items:center;gap:8px;height:34px;margin-top:6px;padding:0 14px 0 10px;border-radius:999px;background:#EFE6D8;font-weight:800;font-size:13px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h6M15 12h6M6.5 9L9.5 12l-3 3M17.5 9L14.5 12l3 3"/></svg><span>Your snake shrinks to 4 segments</span></span>
    </div>
  </sc-if>
  <sc-if value="{{isBiome}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position:absolute;left:36px;right:36px;box-sizing:border-box;border-radius:26px;box-shadow:0 14px 24px -10px rgba(90,59,59,.45);display:flex;flex-direction:column;align-items:center;top:206px;padding:18px 20px 18px;background:#BCDDF4;color:#3F4D5E;gap:4px">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3F4D5E" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M3.4 7l17.2 10M20.6 7L3.4 17M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5"/></svg>

      <span class="lt" style="font-size:42px;color:#FFFFFF;-webkit-text-stroke:8px #3F4D5E;filter:drop-shadow(0 4px 0 #3F4D5E)">Frozen Pond</span>

  <sc-if value="{{isCheckpoint}}" hint-placeholder-val="{{ false }}">

      <span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:900;font-size:22px;line-height:1.1">Next run starts at L6!</span><span style="font-weight:800;font-size:14px">Checkpoint saved</span></span>

  </sc-if>
  <sc-if value="{{isObstacle}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position:absolute;left:223.5px;top:431.0px;width:48px;height:48px;box-sizing:border-box;border-radius:12px;border:3px dashed #5A3B3B"></div>
  <div role="status" style="position:absolute;left:20px;top:426px;width:186px;box-sizing:border-box;min-height:46px;padding:10px 14px;border-radius:16px;background:#5A3B3B;color:#FFFFFF;font-weight:800;font-size:15px;line-height:1.25;text-align:center;box-shadow:0 10px 18px -8px rgba(90,59,59,.55);display:flex;align-items:center;justify-content:center">Mud: half speed while on it<div style="position:absolute;right:-9px;top:19px;width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:10px solid #5A3B3B"></div></div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"skin":{"editor":"enum","options":["snake","cat","dog","capy"],"default":"snake"},"banner":{"editor":"enum","options":["levelUp","biome","checkpoint","skillUnlocked","newObstacle"],"default":"levelUp"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = 21;
    const skin = this.props.skin ?? 'snake';
    const fur = skin;
    const T = { snake: ['#6F93F5', '#3F63D1'], cat: ['#F4A157', '#DB8238'], dog: ['#E9B87F', '#C48A4F'], capy: ['#C79A6B', '#A8794D'] }[skin] ?? ['#6F93F5', '#3F63D1'];
    const ctr = (c, r) => [c * C + C / 2, r * C + C / 2];
    const smooth = (pts, r) => {
      let d = `M${pts[0][0]} ${pts[0][1]}`;
      for (let i = 1; i < pts.length - 1; i++) {
        const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
        const l1 = Math.hypot(px - x, py - y), l2 = Math.hypot(nx - x, ny - y);
        const rr = Math.min(r, l1 / 2, l2 / 2);
        d += ` L${x + (px - x) / l1 * rr} ${y + (py - y) / l1 * rr} Q${x} ${y} ${x + (nx - x) / l2 * rr} ${y + (ny - y) / l2 * rr}`;
      }
      const l = pts[pts.length - 1];
      return d + ` L${l[0]} ${l[1]}`;
    };
    const pts = [[7, 12], [9, 12], [9, 10], [11, 10]].map(([c, r]) => ctr(c, r));
    const head = pts[pts.length - 1];
    return {
      fur,
      skin,
      groundA: this.props.banner === 'biome' ? '#DCEFFB' : '#CFEBD0',
      groundB: this.props.banner === 'biome' ? '#F5FBFF' : '#C2E4C6',
      energyPct: this.props.banner === 'skillUnlocked' ? 50 : 35,
      notSkill: this.props.banner !== 'skillUnlocked',
      isLevelUp: (this.props.banner ?? 'levelUp') === 'levelUp',
      isBiome: this.props.banner === 'biome',
      isCheckpoint: this.props.banner === 'checkpoint',
      isSkill: this.props.banner === 'skillUnlocked',
      isObstacle: this.props.banner === 'newObstacle',
      levelText: { levelUp: 'Level 8', biome: 'Level 11', checkpoint: 'Level 6', skillUnlocked: 'Level 3', newObstacle: 'Level 6' }[this.props.banner ?? 'levelUp'],
      biomeText: { levelUp: 'Rice Paddy', biome: 'Frozen Pond', checkpoint: 'Rice Paddy', skillUnlocked: 'Mango Orchard', newObstacle: 'Rice Paddy' }[this.props.banner ?? 'levelUp'],
      trail: T[0],
      trailDark: T[1],
      snakePath: smooth(pts, 10),
      headStyle: `position:absolute;left:${head[0] - 20}px;top:${head[1] - 22}px`
    };
  }
}
</script>
</body>
</html>
