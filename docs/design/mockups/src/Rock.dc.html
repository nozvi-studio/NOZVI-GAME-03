<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
  <sc-if value="{{isWarn}}" hint-placeholder-val="{{ false }}">
    <div style="{{ringStyle}}"><span style="{{bangStyle}}">!</span></div>
  </sc-if>
  <div style="{{rockStyle}}">
    <div style="{{hlStyle}}"></div>
    <sc-if value="{{isCrumble}}" hint-placeholder-val="{{ false }}">
      <svg width="{{d}}" height="{{d}}" viewBox="0 0 20 20" aria-hidden="true" style="position:absolute;left:0;top:0"><path d="M11 2L8.5 7.5 12 10.5 9 14.5 11 19" fill="none" stroke="{{crack}}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </sc-if>
  </div>
  <sc-if value="{{isCrumble}}" hint-placeholder-val="{{ false }}">
    <div style="{{debris1}}"></div>
    <div style="{{debris2}}"></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","options":["A","B","C"],"default":"A"},"kind":{"editor":"enum","options":["pebble","rock","boulder","warn","crumble"],"default":"rock"},"cell":{"editor":"text","default":"21"},"$preview":{"width":120,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const look = this.props.look ?? 'A';
    const kind = this.props.kind ?? 'rock';
    const s = Number(this.props.cell ?? 21) || 21;
    const k = s / 21;
    const f = { pebble: 0.5, rock: 0.82, boulder: 0.98, warn: 0.82, crumble: 0.82 }[kind] ?? 0.82;
    const d = Math.round(s * f);
    const o = (s - d) / 2;
    const bw = look === 'B' ? Math.max(2, 2 * k) : look === 'C' ? Math.max(2, 2.2 * k) : 0;
    const bc = look === 'B' ? '#2B3248' : '#FFFFFF';
    const fill = { A: '#8F98A8', B: '#9AA3B8', C: '#B5BCCB' }[look] ?? '#8F98A8';
    const sh = {
      A: `inset 0 ${3 * k}px 0 #AEB6C4, inset 0 ${-3 * k}px 0 #747D8E`,
      B: `inset 0 ${-4 * k}px 0 #6B7490, 0 ${2 * k}px 0 rgba(43,50,72,.35)`,
      C: `inset 0 ${-3 * k}px 0 #959DB0, 0 ${3 * k}px ${5 * k}px rgba(40,40,70,.28)`
    }[look];
    const op = kind === 'warn' ? 0.35 : kind === 'crumble' ? 0.65 : 1;
    const deb = (x, y, z) => `position:absolute;left:${x}px;top:${y}px;width:${z}px;height:${z}px;box-sizing:border-box;border-radius:40%;background:${fill};border:${Math.max(1, bw * 0.6)}px solid ${bc}`;
    return {
      d,
      isWarn: kind === 'warn',
      isCrumble: kind === 'crumble',
      crack: look === 'A' ? '#5D6577' : '#2B3248',
      rootStyle: `position:relative;width:${s}px;height:${s}px`,
      rockStyle: `position:absolute;left:${o}px;top:${o}px;width:${d}px;height:${d}px;box-sizing:border-box;border-radius:46% 54% 50% 50% / 56% 52% 48% 44%;background:${fill};border:${bw}px solid ${bc};box-shadow:${sh};opacity:${op}`,
      hlStyle: `position:absolute;left:${d * 0.2}px;top:${d * 0.16}px;width:${d * 0.3}px;height:${d * 0.16}px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-20deg)`,
      ringStyle: `position:absolute;left:${k}px;top:${k}px;width:${s - 2 * k}px;height:${s - 2 * k}px;box-sizing:border-box;border-radius:${6 * k}px;background:rgba(255,107,91,.3);border:${2 * k}px dashed #E5483A;display:flex;align-items:center;justify-content:center`,
      bangStyle: `font-family:'Fredoka',sans-serif;font-weight:700;font-size:${14 * k}px;color:#B3261E;line-height:1`,
      debris1: deb(s * 0.86, s * 0.66, s * 0.2),
      debris2: deb(s * 0.02, s * 0.78, s * 0.15)
    };
  }
}
</script>
</body>
</html>
