<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HeadIcon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0}

</style>
</helmet>
<div style="{{rootStyle}}"><dc-import name="PlayerHead" skin="{{skin}}" size="{{size}}" glow="false" stroke="{{stroke}}" sw="{{sw}}" hint-size="48px,48px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"skin":{"editor":"text","default":"snake"},"size":{"editor":"text","default":"40"},"stroke":{"editor":"text","default":"none"},"sw":{"editor":"text","default":"0"},"$preview":{"width":120,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const px = Number(this.props.size ?? 40) || 40;
    return {
      skin: this.props.skin ?? 'snake',
      size: String(px),
      stroke: this.props.stroke ?? 'none',
      sw: String(this.props.sw ?? 0),
      rootStyle: `width:${px}px;height:${px}px;line-height:0`
    };
  }
}
</script>
</body>
</html>
