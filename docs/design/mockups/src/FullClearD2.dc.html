<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Full clear D2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
body{margin:0}
.lt{font-family:'Lilita One',sans-serif;-webkit-text-stroke:9px #6B4C82;paint-order:stroke fill;line-height:.95;display:inline-block}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#F8F2E8;font-family:'Nunito',system-ui,sans-serif;color:#5A3B3B;display:flex;flex-direction:column;padding:22px 16px 0;gap:14px;overflow:hidden">

  <span aria-hidden="true" style="position:absolute;left:34px;top:120px;width:12px;height:12px;border-radius:50%;background:#F79DBB;transform:rotate(20deg)"></span><span aria-hidden="true" style="position:absolute;left:330px;top:100px;width:10px;height:18px;border-radius:3px;background:#F8D468;transform:rotate(-25deg)"></span><span aria-hidden="true" style="position:absolute;left:60px;top:210px;width:16px;height:8px;border-radius:3px;background:#8CC9F0;transform:rotate(35deg)"></span><span aria-hidden="true" style="position:absolute;left:320px;top:220px;width:12px;height:12px;border-radius:50%;background:#97DB9B;transform:rotate(0deg)"></span><span aria-hidden="true" style="position:absolute;left:20px;top:290px;width:10px;height:16px;border-radius:3px;background:#C6B0F5;transform:rotate(-40deg)"></span><span aria-hidden="true" style="position:absolute;left:352px;top:300px;width:14px;height:8px;border-radius:3px;background:#F79DBB;transform:rotate(15deg)"></span><span aria-hidden="true" style="position:absolute;left:96px;top:96px;width:8px;height:8px;border-radius:50%;background:#97DB9B;transform:rotate(0deg)"></span><span aria-hidden="true" style="position:absolute;left:286px;top:140px;width:16px;height:8px;border-radius:3px;background:#C6B0F5;transform:rotate(-20deg)"></span>

  <div style="position:relative;display:flex;align-items:center;justify-content:space-between">
    <a href="HomeD2.dc.html" aria-label="Home" style="width:44px;height:44px;border-radius:50%;background:#FFFCF6;box-shadow:0 4px 10px -3px rgba(110,80,70,.15);display:flex;align-items:center;justify-content:center;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A3B3B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 5l-7 7 7 7"/></svg></a>
    <div style="width:44px" aria-hidden="true"></div>
  </div>
  <div style="position:relative;display:flex;justify-content:center;gap:2px;margin-top:-6px;filter:drop-shadow(0 5px 0 #6B4C82)"><sc-for list="{{title}}" as="l" hint-placeholder-count="14"><span class="lt" style="{{l.style}}">{{l.ch}}</span></sc-for></div>

  <div style="position:relative;margin-top:56px;box-sizing:border-box;padding:70px 16px 18px;border-radius:30px;background:#FFFCF6;box-shadow:0 14px 24px -10px rgba(110,80,70,.22);display:flex;flex-direction:column;align-items:center;gap:6px">
    <div style="position:absolute;left:50%;top:-58px;transform:translateX(-50%)"><dc-import name="PlayerHead" skin="snake" size="112" glow="true" stroke="none" sw="0" hint-size="112px,112px"></dc-import></div>
    <span style="font-weight:800;font-size:16px;color:#8A6A6A">Every biome cleared. Nice run!</span>
    <span style="font-weight:800;font-size:13px;letter-spacing:.1em;color:#8A6A6A">SCORE</span>
    <span style="font-weight:800;font-size:72px;line-height:.9;color:#5A3B3B">1,280</span>
    <div style="display:flex;align-items:center;gap:6px;height:32px;margin-top:6px;padding:0 16px 0 12px;border-radius:999px;background:#F8D468;font-weight:900;font-size:15px"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="#FFC845"/></svg><span>New best!</span></div>
    <div style="width:100%;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px;margin-top:12px">
      <div style="display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:14px;background:#F6C2D3"><span style="font-weight:800;font-size:12px;letter-spacing:.08em">LEVELS</span><span style="font-weight:800;font-size:28px;line-height:1.1">30/30</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:14px;background:#FBE19A"><span style="font-weight:800;font-size:12px;letter-spacing:.08em">EATEN</span><span style="display:flex;align-items:center;gap:4px;font-weight:800;font-size:28px;line-height:1.1"><dc-import name="FoodIcon" skin="snake" size="24" stroke="none" sw="0" hint-size="24px,24px"></dc-import><span>262</span></span></div>
      <div style="display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:14px;background:#BCDDF4"><span style="font-weight:800;font-size:12px;letter-spacing:.08em">BIOMES</span><span style="font-weight:800;font-size:28px;line-height:1.1">6/6</span></div>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:14px;box-sizing:border-box;padding:12px 20px;border-radius:26px;background:#E8E1FF;box-shadow:0 8px 16px -8px rgba(110,80,70,.18)">
    <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#8EA0FF"/><circle cx="8.5" cy="8.5" r="2.6" fill="#FFFFFF" fill-opacity=".85"/></svg>
    <span style="flex:1;font-weight:800;font-size:17px;line-height:1.1">Bonus marbles</span>
    <span style="font-weight:800;font-size:40px;line-height:1">+30</span>
  </div>

  <div style="position:absolute;left:-70px;bottom:-110px;width:530px;height:270px;border-radius:50% 50% 0 0 / 90px 90px 0 0;background:linear-gradient(#B3DEF3, #9DD3EE)"></div>

  <div style="position:absolute;left:20px;right:20px;bottom:30px;display:flex;flex-direction:column;gap:12px">
    <a href="LoadoutD2.dc.html" style="display:flex;align-items:center;justify-content:center;height:70px;border-radius:999px;background:#79D391;box-shadow:inset 0 -7px 0 #5DB878, inset 0 4px 0 rgba(255,255,255,.4), 0 6px 0 #4A9A63;text-decoration:none"><span class="lt" style="font-size:32px;color:#FFFFFF;-webkit-text-stroke:7px #3E7A52">Play again</span></a>
    <a href="MarbleMachineD2.dc.html" style="display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:999px;font-weight:900;font-size:18px;background:#FFFCF6;box-shadow:0 4px 10px -3px rgba(110,80,70,.15), inset 0 -4px 0 #EFE6D8;text-decoration:none;color:#5A3B3B"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#8EA0FF"/><circle cx="8.5" cy="8.5" r="2.6" fill="#FFFFFF" fill-opacity=".85"/></svg><span>Marble machine</span></a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cols = ['#F79DBB', '#F8D468', '#8CC9F0', '#97DB9B', '#C6B0F5'];
    const title = 'ALL 30 LEVELS!'.split('').map((ch, i) => ch === ' ' ? { ch: '', style: 'width:10px;display:inline-block' } : ({
      ch,
      style: `font-size:36px;color:${cols[i % cols.length]};-webkit-text-stroke:7px #6B4C82;transform:rotate(${i % 2 ? 3 : -3}deg) translateY(${i % 2 ? 2 : -2}px)`
    }));
    return { title };
  }
}
</script>
</body>
</html>
